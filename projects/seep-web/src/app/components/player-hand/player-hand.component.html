<div class="hand-row">
  @for (c of cards(); track $index) {
    <div class="hand-card-slot" [style.transform]="'rotate(' + rotationFor($index) + 'deg)'">
      <app-card
        [card]="c"
        [selected]="isSelected(c)"
        [selectable]="isSelectable(c)"
        (cardClick)="cardSelected.emit(c)"
      />
    </div>
  }
</div>
